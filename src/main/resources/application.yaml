spring:
  # 应用名称
  application:
    name: ai-passage-creator
  # 启用配置文件
  profiles:
    active: pro
  # mysql
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/ai_passage_creator
    username: root
    password: 135564
  session:
    store-type: redis
    timeout: 2592000
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      password:

# mybatis-flex
mybatis-flex:
  configuration:
    map-underscore-to-camel-case: false

# 服务器配置 端口 上下文名称
server:
  port: 8123
  servlet:
    context-path: /api
    session:
      cookie:
        max-age: 2592000

# springdoc-openapi 配置
springdoc:
  group-configs:
    group: 'default'
    paths-to-match: '/**'
    packages-to-scan: com.xuxiaojian.aipassagecreator

# knife4j 接口文档配置
knife4j:
  enable: true
  setting:
    language: zh_cn

# 配置加密盐值
user:
  password:
    salt: "xuxiaojian"

# mermaid
mermaid:
  cli-command: mmdc  # CLI 命令（Windows 下会自动使用 mmdc.cmd）
  background-color: transparent  # 背景颜色
  output-format: svg  # 输出格式（svg/png/pdf）
  width: 1200  # 图片宽度（像素）
  timeout: 30000  # 命令执行超时时间（毫秒）

# Iconify 图标库配置
iconify:
  api-url: https://api.iconify.design
  search-limit: 10
  default-height: 64
  default-color: ""  # 留空使用 currentColor，或设置如 "#000000"

# SVG 概念示意图生成配置
svg-diagram:
  default-width: 800
  default-height: 600
  folder: svg-diagrams  # COS 存储文件夹
