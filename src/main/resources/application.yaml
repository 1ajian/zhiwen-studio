spring:
  # 应用名称
  application:
    name: ai-passage-creator
  # mysql
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/ai_passage_creator
    username: root
    password: 135564
  session:
    store-type: redis
    timeout: 2592000
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      password:

# mybatis-flex
mybatis-flex:
  configuration:
    map-underscore-to-camel-case: false

# 服务器配置 端口 上下文名称
server:
  port: 8123
  servlet:
    context-path: /api
    session:
      cookie:
        max-age: 2592000

# springdoc-openapi 配置
springdoc:
  group-configs:
    group: 'default'
    paths-to-match: '/**'
    packages-to-scan: com.xuxiaojian.aipassagecreator

# knife4j 接口文档配置
knife4j:
  enable: true
  setting:
    language: zh_cn
