server:
  port: 8103
  servlet:
    context-path: /api
    session:
      cookie:
        max-age: 2592000

spring:
  application:
    name: ai-payment-service
  config:
    import:
      - optional:nacos:ai-payment-service.yaml?group=ai-payment-service
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${AI_PAYMENT_DB_URL:jdbc:mysql://localhost:3306/ai_payment?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai}
    username: ${AI_PAYMENT_DB_USERNAME:root}
    password: ${AI_PAYMENT_DB_PASSWORD:}
  session:
    store-type: redis
    timeout: 2592000
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DATABASE:0}
      password: ${REDIS_PASSWORD:}
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        ip: 127.0.0.1
        port: 8103
      config:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        file-extension: yaml

seata:
  enabled: true
  application-id: ${spring.application.name}
  # 这个事务是要交给哪一组
  tx-service-group: payment_tx_group
  enable-auto-data-source-proxy: true
  data-source-proxy-mode: AT
  registry:
    type: nacos
    nacos:
      server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
      cluster: ${SEATA_REGISTRY_CLUSTER:default}
      group: ${SEATA_REGISTRY_GROUP:SEATA_GROUP}
      application: ${SEATA_SERVER_APPLICATION:seata-server}
      namespace: ${NACOS_NAMESPACE:}
  service:
    vgroup-mapping:
      # 这一组要哪个seata集群管
      payment_tx_group: default
    # seata集群管具体在哪
    grouplist:
      default: ${SEATA_SERVER_ADDR:127.0.0.1:8091}

mybatis-flex:
  configuration:
    map-underscore-to-camel-case: false

stripe:
  api-key: ${STRIPE_API_KEY:}
  webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
  success-url: ${STRIPE_SUCCESS_URL:http://localhost:5174/vip?success=true}
  cancel-url: ${STRIPE_CANCEL_URL:http://localhost:5174/vip?cancelled=true}

payment:
  refund:
    compensation:
      channel: payment:refund:compensate
      retry-queue-name: payment:refund:compensate:retry:queue
      max-redis-retry: 3
      redis-retry-delays: [1, 2, 3]
      redis-scheduler-delay: 20000
      processing-timeout-minutes: 1
      event-ttl-days: 1
